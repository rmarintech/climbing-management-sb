# Using GitHub Actions to run CI on every push to main.
# The workflow provisions PostgreSQL and MongoDB as service containers,
# sets up Java 21 with Maven caching,
# builds and tests both Spring Boot applications,
# uploads both JAR artifacts,
# and publishes the Course application Docker image to GHCR.

# CI flow:
#
# Checkout
#    ↓
# Set up Java
#    ↓
# Build/test Course
#    ↓
# Build/test Enrollment
#    ↓
# Upload artifacts
#    ↓
# Login to GHCR
#    ↓
# Build Course Docker image
#    ↓
# Push Course Docker image

name: CI

# Run this workflow whenever somebody pushes code to main.
on:
  push:
    branches: [ main ]

permissions:
  # read repository
  contents: read
  # push Docker image to GHCR
  packages: write

jobs:
  build:
    # Run this job on the latest Ubuntu environment provided by GitHub
    runs-on: ubuntu-latest

    # External services required by the application tests.
    services:

      # PostgreSQL service
      # Temporary credentials used only by the disposable CI database.
      # These are not production credentials.
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: climbing_management
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d climbing_management"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # MongoDB service
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # Downloads your repository's code into the GitHub runner.
      - name: Checkout repository
        #uses: means we're using an existing GitHub Action
        uses: actions/checkout@v5

        # This installs/configures Temurin JDK 21, exactly like the Java version we're using locally.
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          # Allows GitHub Actions to cache Maven dependencies, making subsequent builds faster.
          cache: maven
          # root pom.xml changes
          #       OR
          # enrollment-service/pom.xml changes
          #       ↓
          # Maven cache key can change correctly
          cache-dependency-path: |
            pom.xml
            services/enrollment-service/pom.xml

      - name: Build Course application
        # run: means Execute this shell command on the runner.
        #   mvn test	Compile + run tests
        #   mvn package	Compile + test + create JAR
        #   mvn verify	Package + additional verification
        #   mvn install	Package + install JAR into local Maven repository
        run: |
          chmod +x mvnw
          ./mvnw package
        # Your project needs to have the Maven Wrapper files:  mvnw   mvnw.cmd   .mvn/
        # But GitHub's Ubuntu runner can use:  ./mvnw package

      # Build and test the independent Enrollment Service.
      - name: Build Enrollment Service
        working-directory: services/enrollment-service
        run: |
          chmod +x mvnw
          ./mvnw package

      - name: Upload Course application JAR
        uses: actions/upload-artifact@v4
        with:
          # Gives the artifact a recognizable name in GitHub Actions
          name: climbing-management-jar
          # Maven puts packaged JARs inside target/
          path: target/*.jar

      - name: Upload Enrollment Service JAR
        uses: actions/upload-artifact@v4
        with:
          name: enrollment-service-jar
          path: services/enrollment-service/target/*.jar

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          # GITHUB_TOKEN is an automatically generated, short-lived token provided by GitHub Actions for each workflow run.
          # Its effective permissions are controlled by the workflow permissions block.
          # In this project, packages: write allows the workflow to authenticate to GHCR and publish Docker images.
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # JAR = application artifact
      # Docker image = deployable application package
      # Immutable image tags (github.sha) allow us to identify and deploy an exact application version,
      # making deployments reproducible and rollbacks safer.
      - name: Build Course Docker image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository }}:latest \
            -t ghcr.io/${{ github.repository }}:${{ github.sha }} \
            .

      - name: Push Course Docker image
        run: |
          docker push ghcr.io/${{ github.repository }}:latest
          docker push ghcr.io/${{ github.repository }}:${{ github.sha }}