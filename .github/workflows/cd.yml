# CD flow:
#
# git push → main
#       ↓
#      CI
#       ↓
# Build + test
#       ↓
# Docker build
#       ↓
# ghcr.io/<repo>:<github.sha>
#       ↓
# CI SUCCESS
#       ↓
# workflow_run event
#       ↓
# CD starts
#       ↓
# Production approval gate
#       ↓
# Deploy exact same SHA image


 # head_sha is the exact Git commit successfully built and published by CI.
 # Using the same SHA tag ensures CD deploys the same immutable Docker image
 # instead of rebuilding the application.

name: CD

on:
  workflow_run:
    # Run the CD workflow when the CI workflow finishes.
    workflows: ["CI"]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    # CD can now be blocked before the production deployment happens.
    # (Environment configured in GitHub repository with required reviewers.)
    environment: production
    runs-on: ubuntu-latest

    steps:
      # Deployment simulation
      - name: Deploy Docker image
        # head_sha identifies the exact commit that triggered that CI run.
        run: |
          echo "Deploying image:"
          echo "ghcr.io/${{ github.repository }}:${{ github.event.workflow_run.head_sha }}"