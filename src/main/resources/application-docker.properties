

# Activated because Compose sets:  environment:  SPRING_PROFILES_ACTIVE: docker
# Docker's internal DNS resolves:
#   postgres ? PostgreSQL container
#   mongo    ? MongoDB container

#### POSTGRES
spring.datasource.url=jdbc:postgresql://postgres:5432/${CLIMBAPP_POSTGRES_DB}
spring.datasource.username=${CLIMBAPP_POSTGRES_USER}

# Import Docker/Kubernetes secrets as Spring configuration properties.
spring.config.import=optional:configtree:/run/secrets/

#### MONGO
spring.mongodb.uri=mongodb://mongo:27017/${CLIMBAPP_MONGO_DB}
spring.mongodb.database=${CLIMBAPP_MONGO_DB}

#### KAFKA
# Kafka broker used when the Spring Boot application runs in Docker.
# Containers communicate through the Docker Compose network using
# the Kafka service name and its internal listener port.
spring.kafka.bootstrap-servers=kafka:18082


