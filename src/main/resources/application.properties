
#######This is loaded always, regardless of profile.

#### APPLICATION

spring.application.name=climbing-management-sb

# Tells Hibernate how to manage the database schema.
# update creates missing tables and updates the schema when entity changes are detected without deleting existing data.
# update      -> development / learning
# validate    -> production (checks schema without modifying it)
# create      -> recreates tables when the application starts
# create-drop -> creates tables at startup and removes them at shutdown
spring.jpa.hibernate.ddl-auto=update

# Show SQL generated by Hibernate.
spring.jpa.show-sql=true

# Enables automatic creation of MongoDB indexes defined with Spring Data annotations such as @Indexed and @CompoundIndex.
# Without this setting, indexes declared in the Java entities may not be created automatically in MongoDB.
spring.data.mongodb.auto-index-creation=true

# logging.level.org.springframework.boot.context.config=DEBUG
# debug=true

#### POSTGRES
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

#### MONGO
spring.mongodb.uri=${SPRING_MONGODB_URI}
spring.mongodb.database=${SPRING_MONGODB_DATABASE}

#### KAFKA PRODUCER
# Kafka record key: String -> bytes
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer

# Kafka record value: CourseCreatedEvent -> JSON -> bytes
# Spring Boot 4 / Spring Kafka 4 use Jackson 3.
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer

# By default, JacksonJsonSerializer can add the producer Java class name to Kafka headers.
# We do not want Enrollment coupled to CourseCreatedEvent
# Do not expose the producer's Java class name in Kafka headers.
# Consumers should depend on the event schema, not on the producer's Java package.
spring.kafka.producer.properties[spring.json.add.type.headers]=false