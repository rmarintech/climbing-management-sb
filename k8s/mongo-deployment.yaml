apiVersion: apps/v1
kind: Deployment

metadata:
  name: mongo

spec:
  replicas: 1

  selector:
    matchLabels:
      app: mongo

  template:
    metadata:
      labels:
        app: mongo

    spec:
      containers:
        - name: mongo
          image: mongo:7

          ports:
            - containerPort: 27017

          # Give Mongo enough time to start before liveness checks matter.
          startupProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - "db.adminCommand('ping').ok"
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30

          # Pod receives traffic only when Mongo can actually answer.
          readinessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - "db.adminCommand('ping').ok"
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          # Liveness only checks whether Mongo is still listening.
          # Avoid repeatedly launching mongosh just to decide whether
          # Kubernetes should kill the container.
          livenessProbe:
            tcpSocket:
              port: 27017
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6