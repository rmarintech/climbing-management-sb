apiVersion: apps/v1
kind: Deployment

metadata:
  name: climbing-management

spec:
  # Initial number of application Pods.
  #
  # The HPA can dynamically change the number of replicas
  # between minReplicas (2) and maxReplicas (5).
  replicas: 2

  selector:
    matchLabels:
      app: climbing-management

  template:
    metadata:
      labels:
        app: climbing-management
        deployment: manual

    spec:
      # The application does not need to access the Kubernetes API.
      # Therefore, don't automatically mount a ServiceAccount token.
      automountServiceAccountToken: false

      containers:
        - name: climbing-management

          # Image published by our GitHub Actions CI pipeline.
          image: ghcr.io/rmarintech/climbing-management-sb:latest

          ports:
            - containerPort: 8080

          # Import all non-sensitive configuration
          # from the Kubernetes ConfigMap.
          envFrom:
            - configMapRef:
                name: climbing-management-config

          # Explicitly activate the Docker Spring profile.
          # This is normally already provided by the ConfigMap,
          # but we set it explicitly here to make the Deployment
          # configuration unambiguous.
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: docker

          # ---------------------------------------------
          # RESOURCE REQUESTS & LIMITS
          # ---------------------------------------------
          #
          # Resource requests and limits are important for both
          # Kubernetes scheduling and Horizontal Pod Autoscaling.
          #
          # Requests:
          # - Used by the scheduler to determine where the Pod can run.
          # - Used by HPA as the baseline for CPU utilization.
          #
          # Limits:
          # - Define the maximum CPU/memory the container can consume.
          #
          # With 2 replicas:
          # CPU request:    2 × 250m  = 500m total
          # Memory request: 2 × 512Mi = 1Gi total
          #
          # HPA target:
          # 250m × 70% = 175m CPU per Pod
          resources:
            requests:
              # Request → used for scheduling and HPA utilization calculation.
              cpu: "250m"
              memory: "512Mi"

            limits:
              # Limit → maximum CPU/memory the container can consume.
              cpu: "500m"
              memory: "1Gi"

          # ---------------------------------------------
          # DATABASE PASSWORD SECRET
          # ---------------------------------------------
          #
          # The database password is NOT injected as an
          # environment variable.
          #
          # Kubernetes mounts the Secret as a file instead.
          volumeMounts:
            - name: db-password
              mountPath: /run/secrets
              readOnly: true

          # ---------------------------------------------
          # STARTUP PROBE
          # ---------------------------------------------
          #
          # Gives Spring Boot time to start before
          # liveness checking becomes relevant.
          #
          # 30 failures × 5 seconds = approximately
          # 150 seconds of startup tolerance.
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            failureThreshold: 30
            periodSeconds: 5

          # ---------------------------------------------
          # READINESS PROBE
          # ---------------------------------------------
          #
          # Determines whether this Pod should receive
          # traffic from a Kubernetes Service.
          #
          # If readiness fails, Kubernetes removes the Pod
          # from the Service's traffic endpoints.
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          # ---------------------------------------------
          # LIVENESS PROBE
          # ---------------------------------------------
          #
          # Determines whether Kubernetes should restart
          # the container.
          #
          # If liveness repeatedly fails, Kubernetes
          # restarts the container.
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

      # ---------------------------------------------
      # KUBERNETES SECRET
      # ---------------------------------------------
      #
      # Take the DB_PASSWORD key from our Secret and
      # expose it as:
      #
      # /run/secrets/spring.datasource.password
      #
      # This filename matches Spring Boot's configtree
      # configuration in application-docker.properties.
      volumes:
        - name: db-password
          secret:
            secretName: climbing-management-secret

            items:
              - key: DB_PASSWORD
                path: spring.datasource.password